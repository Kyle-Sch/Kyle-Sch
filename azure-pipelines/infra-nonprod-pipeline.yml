###############################################################################
# infra-nonprod-pipeline.yml — Terraform nonprod environment
#
# PR  → plan only (no apply)
# main merge → plan + apply (auto, no approval gate)
#
# State files:
#   nonprod/aks-cluster.tfstate
#   nonprod/azure-storage.tfstate
###############################################################################

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  - group: terraform-sp
  - name: TF_VERSION
    value: "1.7.5"
  - name: TF_BACKEND_RG
    value: "rg-terraform-state"
  - name: TF_BACKEND_SA
    value: "sttfstate"
  - name: TF_BACKEND_CONTAINER
    value: "tfstate"

stages:
  # ---------------------------------------------------------------------------
  # AKS — plan then apply in parallel with storage plan
  # ---------------------------------------------------------------------------
  - stage: PlanNonprodAKS
    displayName: "Plan · AKS"
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          tfVersion:          $(TF_VERSION)
          tfWorkingDir:       terraform/nonprod/azure-aks-cluster
          tfBackendRg:        $(TF_BACKEND_RG)
          tfBackendSa:        $(TF_BACKEND_SA)
          tfBackendContainer: $(TF_BACKEND_CONTAINER)
          tfVarsFile:         terraform/nonprod/azure-aks-cluster/terraform.tfvars
          artifactSuffix:     "-nonprod-aks"

  - stage: ApplyNonprodAKS
    displayName: "Apply · AKS"
    dependsOn: PlanNonprodAKS
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: templates/terraform-apply.yml
        parameters:
          tfVersion:          $(TF_VERSION)
          tfWorkingDir:       terraform/nonprod/azure-aks-cluster
          tfBackendRg:        $(TF_BACKEND_RG)
          tfBackendSa:        $(TF_BACKEND_SA)
          tfBackendContainer: $(TF_BACKEND_CONTAINER)
          artifactSuffix:     "-nonprod-aks"
          environment:        "infrastructure-nonprod"

  # ---------------------------------------------------------------------------
  # Storage — plan runs in parallel with AKS plan; apply waits for AKS apply
  # ---------------------------------------------------------------------------
  - stage: PlanNonprodStorage
    displayName: "Plan · Storage"
    dependsOn: []
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          tfVersion:          $(TF_VERSION)
          tfWorkingDir:       terraform/nonprod/azure-storage
          tfBackendRg:        $(TF_BACKEND_RG)
          tfBackendSa:        $(TF_BACKEND_SA)
          tfBackendContainer: $(TF_BACKEND_CONTAINER)
          tfVarsFile:         terraform/nonprod/azure-storage/terraform.tfvars
          artifactSuffix:     "-nonprod-storage"

  - stage: ApplyNonprodStorage
    displayName: "Apply · Storage"
    dependsOn:
      - PlanNonprodStorage
      - ApplyNonprodAKS
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: templates/terraform-apply.yml
        parameters:
          tfVersion:          $(TF_VERSION)
          tfWorkingDir:       terraform/nonprod/azure-storage
          tfBackendRg:        $(TF_BACKEND_RG)
          tfBackendSa:        $(TF_BACKEND_SA)
          tfBackendContainer: $(TF_BACKEND_CONTAINER)
          artifactSuffix:     "-nonprod-storage"
          environment:        "infrastructure-nonprod"
