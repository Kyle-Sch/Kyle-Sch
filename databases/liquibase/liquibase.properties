###############################################################################
# liquibase.properties
#
# Connection config for local development.
# In CI/CD all values are overridden via environment variables or
# --url / --username / --password flags — never commit real credentials.
#
# Property substitution: ${VAR} is replaced at runtime by Liquibase using
# values from this file, environment variables, or -D flags.
###############################################################################

# ---------------------------------------------------------------------------
# Changelog entry point
# ---------------------------------------------------------------------------
changeLogFile=changelog-master.xml

# ---------------------------------------------------------------------------
# Database connection (override per environment)
# ---------------------------------------------------------------------------
# SQL Server (default for local dev)
url=jdbc:sqlserver://localhost:1433;databaseName=ecommerce;encrypt=false
driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
username=${DB_USERNAME}
password=${DB_PASSWORD}

# PostgreSQL — swap in for PG environments
# url=jdbc:postgresql://localhost:5432/ecommerce
# driver=org.postgresql.Driver

# ---------------------------------------------------------------------------
# Liquibase behaviour
# ---------------------------------------------------------------------------
# Schema where DATABASECHANGELOG tracking tables live
liquibaseSchemaName=dbo

# Default schema for all DDL/DML changesets
defaultSchemaName=dbo

# Logging level: OFF | SEVERE | WARNING | INFO | FINE
logLevel=INFO

# Show SQL that will be executed without actually running it (dry-run)
# Uncomment to preview: liquibase --show-summary updateSQL
# showSummary=VERBOSE
